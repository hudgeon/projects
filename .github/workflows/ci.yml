# The checks, self-contained so a fork or the public copy runs them unchanged. Arming and the merge queue are
# .github/workflows/auto-merge.yml, which is not published.
name: CI

on:
  pull_request:
  # The merge queue's run, on the commit main will be given.
  merge_group:
  push:
    branches: [main, 'codex/**']

permissions: {}

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The check the branch requires, by this name.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0 # the file size check needs where work left main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm run file-sizes:check -- "$BASE"
        env:
          # A queued commit is checked against the main it follows, and main itself against main before the push.
          BASE: ${{ github.event.merge_group.base_sha || (github.ref == 'refs/heads/main' && github.event.before) || 'origin/main' }}
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run collector:build
